<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flip Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b0b0f;--card:#17171f;--fg:#f2f2f7;--mut:#8e8e9a;--acc:#ff3b5c;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;gap:8px;padding:8px;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));overflow:hidden}
input{flex:1;min-width:0;background:var(--card);border:1px solid #2a2a35;color:var(--fg);border-radius:12px;padding:12px;font-size:15px}
button{background:var(--card);color:var(--fg);border:0;border-radius:12px;font-size:20px;min-height:48px;min-width:48px;padding:0 14px;-webkit-tap-highlight-color:transparent}
button:active{background:#262633}
.go{background:var(--acc);font-weight:600;font-size:16px}
.on{color:var(--acc)}

/* Main screen layout (panel children join the page flow) */
#panel{display:contents}
.row{display:flex;gap:6px;order:0}
.stage{order:1;position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;flex:none}
.ctrl{order:2;display:flex;gap:6px}
.tabs{order:3;display:flex;gap:6px}
.list{order:4;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.dhead{display:none}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);padding:16px;font-size:14px}
.ctrl button{flex:1}
.tabs button{flex:1;min-height:38px;font-size:14px;color:var(--mut)}
.tabs button.sel{color:var(--fg);background:#262633}
.item{display:flex;align-items:center;gap:6px}
.item .t{flex:1;min-width:0;text-align:left;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px}
.item .x,.item .e{min-width:44px;padding:0;color:var(--mut);font-size:16px}
.item input{font-size:14px;padding:10px 12px}
.empty{color:var(--mut);font-size:14px;padding:8px}

/* Full-screen player */
.shield,.fsbar{display:none}
body.fs{padding:0}
body.fs>.ctrl{display:none}
body.fs .stage{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0;z-index:5}
body.fs.fill .stage iframe{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);
  width:max(100vw,177.78vh);height:max(100vh,56.25vw);
  width:max(100vw,calc(100dvh*16/9));height:max(100dvh,calc(100vw*9/16))}
body.fs .shield{display:block;position:fixed;inset:0;z-index:6;touch-action:none}

/* Control column on the right */
body.fs .fsbar{display:flex;flex-direction:column;justify-content:center;gap:8px;position:fixed;z-index:7;
  top:calc(8px + env(safe-area-inset-top,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));
  right:calc(8px + env(safe-area-inset-right,0px));width:58px;transition:opacity .25s}
.fsbar button{width:58px;min-height:54px;padding:0;background:rgba(23,23,31,.82);font-size:20px}
.fsbar .sm{min-height:40px;font-size:13px;font-weight:600;color:var(--mut)}
.fsbar .gap{height:4px}
.fsbar.hide{opacity:0;pointer-events:none}
body.fs .fsbar,body.fs .fsbar button{touch-action:none}

/* Swipe-in drawer with link box, Recent and Favorites */
body.fs #panel{display:flex;flex-direction:column;gap:8px;position:fixed;top:0;right:0;bottom:0;width:88vw;max-width:420px;z-index:10;
  background:var(--bg);padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  box-shadow:-8px 0 24px rgba(0,0,0,.6);transform:translateX(105%);transition:transform .25s ease}
body.fs.drawer #panel{transform:none}
body.fs .dhead{display:flex;align-items:center;justify-content:space-between;color:var(--mut);font-size:13px;padding:0 4px}
body.fs .dhead button{min-height:36px;min-width:36px;font-size:16px;padding:0}
</style>
</head>
<body>
<div class="stage" id="stage"><div class="msg">Paste a YouTube or YouTube Music link to start.</div></div>
<div class="ctrl">
  <button id="prev" aria-label="Previous">⏮</button>
  <button id="pp" aria-label="Play or pause">⏯</button>
  <button id="next" aria-label="Next">⏭</button>
  <button id="fav" aria-label="Favorite">♥</button>
  <button id="fs" aria-label="Full screen">⛶</button>
</div>
<div id="panel">
  <div class="dhead"><span>Swipe right to close · v<span id="ver"></span></span><button id="dclose" aria-label="Close list">›</button></div>
  <div class="row">
    <input id="url" type="url" inputmode="url" placeholder="Paste YouTube link or playlist" autocomplete="off">
    <button class="go" id="go">Play</button>
  </div>
  <div class="tabs">
    <button id="tR" class="sel">Recent</button>
    <button id="tF">Favorites</button>
  </div>
  <div class="list" id="list"></div>
</div>
<div class="shield" id="shield"></div>
<div class="fsbar" id="fsbar">
  <button id="fexit" class="sm" aria-label="Exit full screen">✕</button>
  <button id="mode" class="sm" aria-label="Switch Fit or Fill">Fit</button>
  <div class="gap"></div>
  <button id="fprev" aria-label="Previous">⏮</button>
  <button id="fpp" aria-label="Play or pause">⏯</button>
  <button id="fnext" aria-label="Next">⏭</button>
  <button id="ffav" aria-label="Favorite">♥</button>
</div>

<script>
(function(){
  var APP_VERSION=5;
  var KEY_R='fp_recent', KEY_F='fp_fav';
  var tab='R', current=null, playing=true, fill=true, realFs=false, hideT=null, editing=-1;
  var $=function(id){return document.getElementById(id)};
  var body=document.body;

  function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):[]}catch(e){return []}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

  function parse(s){
    s=(s||'').trim();
    if(/^[\w-]{11}$/.test(s)) return {v:s};
    var u;
    try{u=new URL(s)}catch(e){return null}
    var h=u.hostname.replace(/^www\.|^m\.|^music\./,'');
    var list=u.searchParams.get('list');
    var v=null;
    if(h==='youtu.be') v=u.pathname.slice(1).split('/')[0];
    else if(h==='youtube.com'){
      v=u.searchParams.get('v');
      var m=u.pathname.match(/^\/(embed|shorts|live)\/([\w-]{11})/);
      if(!v&&m) v=m[2];
    } else return null;
    if(v&&!/^[\w-]{11}$/.test(v)) v=null;
    if(!v&&!list) return null;
    return {v:v,l:list};
  }
  function key(p){return (p.v||'')+'|'+(p.l||'')}
  function src(p){
    var q='?enablejsapi=1&playsinline=1&rel=0&autoplay=1&fs=0&origin='+encodeURIComponent(location.origin);
    if(p.l&&!p.v) return 'https://www.youtube.com/embed/videoseries'+q+'&list='+encodeURIComponent(p.l);
    return 'https://www.youtube.com/embed/'+p.v+q+(p.l?'&list='+encodeURIComponent(p.l):'');
  }
  function cmd(f){
    var fr=$('stage').querySelector('iframe');
    if(!fr||!fr.contentWindow) return;
    fr.contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:''}),'*');
  }
  function label(p){return p.l&&!p.v?'Playlist '+p.l.slice(0,14)+'…':(p.l?'Video '+p.v+' + playlist':'Video '+p.v)}

  // 1) Playing always opens full screen in Fill
  function play(p){
    current={v:p.v||null,l:p.l||null}; playing=true;
    var st=$('stage');
    st.innerHTML='';
    var f=document.createElement('iframe');
    f.src=src(current);
    f.allow='autoplay; encrypted-media; picture-in-picture';
    f.title='YouTube player';
    f.referrerPolicy='strict-origin-when-cross-origin';
    f.onload=function(){
      try{f.contentWindow.postMessage(JSON.stringify({event:'listening',id:1,channel:'widget'}),'*')}catch(e){}
    };
    st.appendChild(f);
    var note=document.createElement('div');
    note.className='msg'; note.style.zIndex='-1';
    note.textContent='Video unavailable? The owner may have blocked embedding, or the playlist is private.';
    st.appendChild(note);
    addRecent(current, p.t);
    fill=true; closeDrawer(); enterFs();
    render();
  }
  function addRecent(p,t){
    var r=load(KEY_R), old=null;
    r=r.filter(function(x){if(key(x)===key(p)){old=x;return false}return true});
    r.unshift(old||{v:p.v,l:p.l,t:t||label(p)});
    save(KEY_R,r.slice(0,20));
  }

  // Fill in the real video title once the player reports it (unless renamed)
  function gotTitle(title){
    if(!current||!title) return;
    var t=current.l?title+' · playlist':title;
    [KEY_R,KEY_F].forEach(function(k){
      var a=load(k), ch=false;
      a.forEach(function(x){if(key(x)===key(current)&&!x.c&&!x.auto){x.t=t;x.auto=1;ch=true}});
      if(ch) save(k,a);
    });
    if(editing<0) render();
  }

  function isFav(p){return !!p&&load(KEY_F).some(function(x){return key(x)===key(p)})}
  function toggleFav(){
    if(!current) return;
    var f=load(KEY_F);
    if(isFav(current)) f=f.filter(function(x){return key(x)!==key(current)});
    else{
      var r=load(KEY_R).filter(function(x){return key(x)===key(current)})[0];
      f.unshift({v:current.v,l:current.l,t:r?r.t:label(current),auto:r&&r.auto?1:0});
    }
    save(KEY_F,f);
    render();
  }
  function remove(k,i){var a=load(k); a.splice(i,1); save(k,a); render()}

  // 4) Rename a favorite
  function rename(i,name){
    var a=load(KEY_F); if(!a[i]) return;
    name=(name||'').trim();
    if(name){a[i].t=name;a[i].c=1}
    save(KEY_F,a);
  }

  function render(){
    var fv=isFav(current);
    $('fav').classList.toggle('on',fv); $('ffav').classList.toggle('on',fv);
    $('tR').classList.toggle('sel',tab==='R');
    $('tF').classList.toggle('sel',tab==='F');
    var k=tab==='R'?KEY_R:KEY_F, a=load(k), L=$('list');
    L.innerHTML='';
    if(!a.length){
      var e=document.createElement('div'); e.className='empty';
      e.textContent=tab==='R'?'Nothing played yet.':'No favorites yet. Tap ♥ while playing.';
      L.appendChild(e); return;
    }
    a.forEach(function(it,i){
      var d=document.createElement('div'); d.className='item';
      if(tab==='F'&&editing===i){
        var inp=document.createElement('input'); inp.value=it.t; inp.setAttribute('aria-label','New name');
        var ok=document.createElement('button'); ok.className='e'; ok.textContent='✓'; ok.setAttribute('aria-label','Save name');
        var done=function(){rename(i,inp.value);editing=-1;render()};
        ok.onclick=done;
        inp.addEventListener('keydown',function(ev){if(ev.key==='Enter')done();if(ev.key==='Escape'){editing=-1;render()}});
        d.appendChild(inp); d.appendChild(ok); L.appendChild(d);
        setTimeout(function(){inp.focus();inp.select()},0);
        return;
      }
      var b=document.createElement('button'); b.className='t'; b.textContent=it.t;
      b.onclick=function(){play(it)};
      d.appendChild(b);
      if(tab==='F'){
        var ed=document.createElement('button'); ed.className='e'; ed.textContent='✎';
        ed.setAttribute('aria-label','Rename');
        ed.onclick=function(){editing=i;render()};
        d.appendChild(ed);
      }
      var x=document.createElement('button'); x.className='x'; x.textContent='✕';
      x.setAttribute('aria-label','Remove');
      x.onclick=function(){remove(k,i)};
      d.appendChild(x); L.appendChild(d);
    });
  }
  function submit(){
    var p=parse($('url').value);
    if(!p){
      $('url').value=''; $('url').placeholder='Not a YouTube link. Try again.';
      return;
    }
    $('url').value=''; $('url').placeholder='Paste YouTube link or playlist';
    play(p);
  }

  // Full screen + Fit/Fill
  function applyMode(){
    body.classList.toggle('fill',fill);
    $('mode').textContent=fill?'Fit':'Fill';   // shows what tapping switches to
  }
  function showBar(){
    var b=$('fsbar'); b.classList.remove('hide'); clearTimeout(hideT);
    if(body.classList.contains('fs')&&!body.classList.contains('drawer'))
      hideT=setTimeout(function(){b.classList.add('hide')},3000);
  }
  function hideBar(){clearTimeout(hideT);$('fsbar').classList.add('hide')}
  function enterFs(){
    body.classList.add('fs'); applyMode(); showBar();
    var el=document.documentElement;
    if(el.requestFullscreen&&!document.fullscreenElement){
      try{var r=el.requestFullscreen({navigationUI:'hide'});if(r&&r.catch)r.catch(function(){})}catch(e){}
    }
  }
  function exitFs(){
    body.classList.remove('fs','drawer'); clearTimeout(hideT);
    if(document.fullscreenElement&&document.exitFullscreen){try{document.exitFullscreen()}catch(e){}}
  }
  document.addEventListener('fullscreenchange',function(){
    if(document.fullscreenElement===document.documentElement) realFs=true;
    else if(!document.fullscreenElement&&realFs){realFs=false;exitFs()}
  });

  // 3) Drawer
  function openDrawer(){body.classList.add('drawer');hideBar();editing=-1;render()}
  function closeDrawer(){
    if(!body.classList.contains('drawer')) return;
    body.classList.remove('drawer'); editing=-1;
    if(document.activeElement) document.activeElement.blur();
    showBar();
  }

  // Tap the video = show/hide bar. Swipe left anywhere (even on the bar) = open lists.
  var sx=0, sy=0, down=false, onShield=false;
  document.addEventListener('pointerdown',function(e){
    if(!body.classList.contains('fs')) return;
    down=true; sx=e.clientX; sy=e.clientY; onShield=(e.target===$('shield'));
  });
  document.addEventListener('pointerup',function(e){
    if(!down) return; down=false;
    var dx=e.clientX-sx, dy=e.clientY-sy, drawer=body.classList.contains('drawer');
    if(drawer){ if(onShield) closeDrawer(); return; }
    if(dx<-50&&Math.abs(dx)>Math.abs(dy)){openDrawer();return}
    if(onShield&&Math.abs(dx)<12&&Math.abs(dy)<12){
      if($('fsbar').classList.contains('hide')) showBar(); else hideBar();
    }
  });
  document.addEventListener('pointercancel',function(){down=false});

  // Swipe right on the drawer to close it
  var px=0, py=0;
  $('panel').addEventListener('touchstart',function(e){var t=e.touches[0];px=t.clientX;py=t.clientY},{passive:true});
  $('panel').addEventListener('touchend',function(e){
    if(!body.classList.contains('drawer')) return;
    var t=e.changedTouches[0], dx=t.clientX-px, dy=t.clientY-py;
    if(dx>60&&Math.abs(dx)>Math.abs(dy)*1.5) closeDrawer();
  },{passive:true});
  $('dclose').onclick=closeDrawer;

  // Player state + title from YouTube
  window.addEventListener('message',function(e){
    if(!/youtube(-nocookie)?\.com$/.test((e.origin||'').replace(/:\d+$/,''))) return;
    var d; try{d=typeof e.data==='string'?JSON.parse(e.data):e.data}catch(x){return}
    if(!d) return;
    var s=null;
    if(d.event==='onStateChange') s=d.info;
    else if(d.event==='infoDelivery'&&d.info){
      if(typeof d.info.playerState==='number') s=d.info.playerState;
      if(d.info.videoData&&d.info.videoData.title) gotTitle(d.info.videoData.title);
    }
    if(s!==null) playing=(s===1||s===3);
  });

  function togglePlay(){playing=!playing;cmd(playing?'playVideo':'pauseVideo');showBar()}
  $('go').onclick=submit;
  $('url').addEventListener('keydown',function(e){if(e.key==='Enter')submit()});
  $('pp').onclick=togglePlay;
  $('next').onclick=function(){cmd('nextVideo')};
  $('prev').onclick=function(){cmd('previousVideo')};
  $('fav').onclick=toggleFav;
  $('fs').onclick=function(){fill=true;enterFs()};
  $('fexit').onclick=exitFs;
  $('fpp').onclick=togglePlay;
  $('fnext').onclick=function(){cmd('nextVideo');showBar()};
  $('fprev').onclick=function(){cmd('previousVideo');showBar()};
  $('ffav').onclick=function(){toggleFav();showBar()};
  $('mode').onclick=function(){fill=!fill;applyMode();showBar()};
  $('tR').onclick=function(){tab='R';editing=-1;render()};
  $('tF').onclick=function(){tab='F';editing=-1;render()};
  applyMode();
  render();
  $('ver').textContent=APP_VERSION;

  // Auto-update: whenever the app comes on screen (cover or main), check for a newer version and reload
  var checking=false;
  function checkUpdate(){
    if(checking||location.protocol!=='https:') return; checking=true;
    fetch('index.html?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
      var m=t.match(/APP_VERSION=(\d+)/);
      if(m&&+m[1]>APP_VERSION) location.reload();
    }).catch(function(){}).then(function(){checking=false});
  }
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')checkUpdate()});
  window.addEventListener('focus',checkUpdate);
  setTimeout(checkUpdate,1500);
  if('serviceWorker' in navigator&&location.protocol==='https:'){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
